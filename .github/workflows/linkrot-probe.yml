name: linkrot-probe
# Runs one LINKROT pass from this runner's network over data/linkrot/urls.txt. Triggered by the HST tick bus (Heuremen Standard Time) through repository_dispatch, never on a timer.
on:
  repository_dispatch:
    types: [linkrot-probe]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: One pass over the list
        run: python3 linkrot/linkrot_probe.py
      - name: Save the pass
        run: |
          git config user.name "Bones"
          git config user.email "268764679+claude-wayfinder@users.noreply.github.com"
          git add data/linkrot/results.jsonl
          git commit -m "LINKROT pass from the GitHub runner network" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && exit 0; sleep $((i*7)); done; exit 1
