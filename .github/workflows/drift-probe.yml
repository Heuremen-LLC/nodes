name: drift-probe
# One DRIFT SEAT probe from this runner. Triggered by the HST tick bus (Heuremen Standard Time) through repository_dispatch, never on a timer.
on:
  repository_dispatch:
    types: [drift-probe]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: drift
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: One probe
        run: python3 drift/drift_probe.py
      - name: Save the probe
        run: |
          git config user.name "Bones"
          git config user.email "268764679+claude-wayfinder@users.noreply.github.com"
          git add data/drift
          git commit -m "DRIFT seat probe from the GitHub runner" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && exit 0; sleep $((i*7)); done; exit 1
